Train:
  batch_size: 128
  learning_rate: 0.05
  reg: 0.0001
  epochs: 30
  steps: [20, 25]
  warmup: 5
  momentum: 0.9
  gamma: 2

network:
  model: ResNet-32 # TwoLayerNet or VanillaCNN or MyModel or ResNet-32
  save_best: True

data:
  imbalance: imbalance # regular or imbalance
  beta: 0.995

loss:
  loss_type: Focal # CE or Focal
